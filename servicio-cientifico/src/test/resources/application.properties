# Aislamiento de pruebas (BUG-J4): un .env local (p. ej. del perfil Aiven real) importado por
# spring.config.import puede definir *_MIGR_USER/*_MIGR_PASSWORD; Flyway las usaria contra el MySQL
# de Testcontainers y fallaria con Access denied. En pruebas Flyway migra con el mismo usuario del
# datasource (que cada prueba fija via DynamicPropertySource). Solo aplica al classpath de pruebas.
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
