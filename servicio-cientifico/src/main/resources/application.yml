spring:
  application:
    name: servicio-cientifico
  config:
    # Lee el .env de la raíz del monorepo y el .env propio del servicio (el último gana), al ejecutar
    # desde la carpeta del servicio. Ver servicio-cientifico/.env.example.
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    # Sin valores por defecto: la URL, el usuario y la contraseña salen del entorno.
    # Los perfiles "local" y "aiven" (application-local.yml / application-aiven.yml) arman la URL.
    # Sin perfil, hay que definir CIENTIFICO_DB_URL completa (jdbc:mysql://host:puerto/cientifico?...).
    url: ${CIENTIFICO_DB_URL}
    username: ${CIENTIFICO_DB_USER}
    password: ${CIENTIFICO_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, nunca Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # DATETIME(3) en UTC (05-modelo-datos §3)
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Versiones con fecha (V20261022_1430__...): acepta migraciones que llegan "tarde" al fusionar ramas
    out-of-order: true
    # Opcional (SEC-11): usuario de migración distinto del de ejecución. Si no se define, usa el del datasource.
    user: ${CIENTIFICO_MIGR_USER:${spring.datasource.username}}
    password: ${CIENTIFICO_MIGR_PASSWORD:${spring.datasource.password}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    publisher-confirm-type: correlated   # el publicador espera la confirmación del broker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/biohub}
          audiences: ${KEYCLOAK_AUDIENCE:biohub-api}

server:
  port: ${SERVICIO_CIENTIFICO_PORT:8081}
  # Solo localhost: obliga a entrar por el gateway. En contenedores usar SERVER_ADDRESS=0.0.0.0 + red interna.
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

biohub:
  ubicacion:
    cifrado:
      # Llaves AES-256 versionadas: "v1:<base64 de 32 bytes>,v2:<...>" (openssl rand -base64 32).
      # Sin llave activa válida el servicio NO arranca (D20). Nunca poner valores reales aquí.
      claves: ${UBICACION_CLAVES:}
      clave-activa: ${UBICACION_CLAVE_ACTIVA:}
      # Solo con el perfil "dev": genera una llave efímera en memoria (las coordenadas guardadas
      # se pierden al reiniciar). Desactivado por defecto; jamás activarlo en las VMs.
      llave-efimera-dev: ${UBICACION_LLAVE_EFIMERA_DEV:false}
  eventos:
    exchange: biohub.eventos
    timeout-confirmacion: 5s
