spring:
  application:
    name: servicio-reportes
  config:
    # Lee el .env de la raíz del monorepo y el .env propio del servicio (el último gana), al ejecutar
    # desde la carpeta del servicio. Ver servicio-reportes/.env.example.
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    # Sin valores por defecto: la URL, el usuario y la contraseña salen del entorno.
    # Los perfiles "local" y "aiven" (application-local.yml / application-aiven.yml) arman la URL.
    # Sin perfil, hay que definir REPORTES_DB_URL completa (jdbc:mysql://host:puerto/reportes?...).
    url: ${REPORTES_DB_URL}
    username: ${REPORTES_DB_USER}
    password: ${REPORTES_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, nunca Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Versiones con fecha (V20261022_1430__...): acepta migraciones que llegan "tarde" al fusionar ramas
    out-of-order: true
    # Opcional (SEC-11): usuario de migración distinto del de ejecución. Si no se define, usa el del datasource.
    user: ${REPORTES_MIGR_USER:${spring.datasource.username}}
    password: ${REPORTES_MIGR_PASSWORD:${spring.datasource.password}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    listener:
      simple:
        default-requeue-rejected: false   # rechazados -> DLX/DLQ, nunca reencolados
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/biohub}
          audiences: ${KEYCLOAK_AUDIENCE:biohub-api}

server:
  port: ${SERVICIO_REPORTES_PORT:8084}
  # Solo localhost: obliga a entrar por el gateway. En contenedores usar SERVER_ADDRESS=0.0.0.0 + red interna.
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

biohub:
  eventos:
    exchange: biohub.eventos
    dlx: biohub.eventos.dlx
    cola: reportes.eventos
