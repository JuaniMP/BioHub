# Perfil "local": MySQL del docker-compose.yml de la raíz (docker compose up -d).
# Activar:  SPRING_PROFILES_ACTIVE=local   (las credenciales vienen del .env de la raíz)
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_ANALITICA_HOST:localhost}:${MYSQL_ANALITICA_PORT:3309}/reportes
    username: ${MYSQL_ANALITICA_USER}
    password: ${MYSQL_ANALITICA_PASSWORD}
