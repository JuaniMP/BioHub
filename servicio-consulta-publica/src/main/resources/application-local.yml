# Perfil "local": MySQL del docker-compose.yml de la raíz (docker compose up -d).
# Activar:  SPRING_PROFILES_ACTIVE=local   (las credenciales vienen del .env de la raíz)
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_LECTURA_HOST:localhost}:${MYSQL_LECTURA_PORT:3308}/consulta_publica
    username: ${MYSQL_LECTURA_USER}
    password: ${MYSQL_LECTURA_PASSWORD}
