spring:
  application:
    name: servicio-consulta-publica
  config:
    # Lee el .env de la raíz del monorepo (al ejecutar desde la carpeta del servicio)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_LECTURA_HOST:localhost}:${MYSQL_LECTURA_PORT:3308}/consulta_publica
    username: ${MYSQL_LECTURA_USER}
    password: ${MYSQL_LECTURA_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, nunca Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 10m
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/biohub}
          audiences: ${KEYCLOAK_AUDIENCE:biohub-api}

server:
  port: ${SERVICIO_CONSULTA_PUBLICA_PORT:8083}
  # Solo localhost: obliga a entrar por el gateway. En contenedores usar SERVER_ADDRESS=0.0.0.0 + red interna.
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

biohub:
  eventos:
    exchange: biohub.eventos
