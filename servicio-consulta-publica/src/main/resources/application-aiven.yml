# Perfil "aiven": MySQL administrado en Aiven, con SSL obligatorio y verificación del CA y del host.
# Activar:  SPRING_PROFILES_ACTIVE=aiven   (variables en servicio-consulta-publica/.env.example)
#
# MySQL Connector/J 9.x no lee PEM: el CA de Aiven (ca.pem) debe convertirse una vez a un truststore PKCS12
# (comando en docs/equipo/09-despliegue.md). AIVEN_TRUSTSTORE_PATH es la ruta ABSOLUTA de ese .p12.
#   sslMode=VERIFY_IDENTITY  (por defecto) verifica que el CA de Aiven firma el certificado y que el host coincide.
#   AIVEN_SSL_MODE=VERIFY_CA solo verifica el CA, no el host (usar solo si se conecta por IP).
# Nunca bajar a PREFERRED/REQUIRED: cifrarían sin verificar al servidor.
spring:
  datasource:
    url: "jdbc:mysql://${CONSULTA_DB_HOST}:${CONSULTA_DB_PORT}/${CONSULTA_DB_NAME:consulta_publica}?sslMode=${AIVEN_SSL_MODE:VERIFY_IDENTITY}&trustCertificateKeyStoreUrl=file:${AIVEN_TRUSTSTORE_PATH}&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=${AIVEN_TRUSTSTORE_PASSWORD}&connectTimeout=${CONSULTA_DB_CONNECT_TIMEOUT_MS:3000}&socketTimeout=${CONSULTA_DB_SOCKET_TIMEOUT_MS:30000}&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true"
    hikari:
      # Falla rápido con 503 (J10): se mantiene el criterio de 2 s de local con un margen de 1 s
      # por el handshake TLS a internet (3 s). connect-timeout del driver (3 s) <= este valor + margen.
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 120000
