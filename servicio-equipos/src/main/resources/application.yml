spring:
  application:
    name: servicio-equipos
  config:
    # Lee el .env de la raíz del monorepo (al ejecutar desde la carpeta del servicio)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_TRANSACCIONAL_HOST:localhost}:${MYSQL_TRANSACCIONAL_PORT:3307}/equipos
    username: ${MYSQL_EQUIPOS_USER}
    password: ${MYSQL_EQUIPOS_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, nunca Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Versiones con fecha (V20261022_1430__...): acepta migraciones que llegan "tarde" al fusionar ramas
    out-of-order: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/biohub}
          audiences: ${KEYCLOAK_AUDIENCE:biohub-api}

server:
  port: ${SERVICIO_EQUIPOS_PORT:8082}
  # Solo localhost: obliga a entrar por el gateway. En contenedores usar SERVER_ADDRESS=0.0.0.0 + red interna.
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
