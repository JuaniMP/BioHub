# Perfil "local": MySQL del docker-compose.yml de la raíz (docker compose up -d).
# Activar:  SPRING_PROFILES_ACTIVE=local   (las credenciales vienen del .env de la raíz)
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_TRANSACCIONAL_HOST:localhost}:${MYSQL_TRANSACCIONAL_PORT:3307}/equipos
    username: ${MYSQL_EQUIPOS_USER}
    password: ${MYSQL_EQUIPOS_PASSWORD}
