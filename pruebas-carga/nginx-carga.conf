# Balanceador del compose de carga (SAD §5.3): reparte entre las réplicas de consulta-publica (round robin por DNS de Docker).
worker_rlimit_nofile 65536;
events { worker_connections 8192; }
http {
  access_log off;
  upstream consulta { server consulta-publica:8083 max_fails=0; keepalive 256; }
  server {
    listen 8080;
    location / {
      proxy_pass http://consulta;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 2s; proxy_read_timeout 15s;
    }
    location = /nginx-ping { return 200 "ok\n"; }
  }
}
