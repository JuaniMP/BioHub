# Perfil "aiven": MySQL administrado en Aiven, con SSL obligatorio y verificación del CA.
# Activar:  SPRING_PROFILES_ACTIVE=aiven   (variables en api-gateway/.env.example)
#
# MySQL Connector/J 9.x no lee PEM: el CA de Aiven (ca.pem) debe convertirse una vez a un truststore PKCS12
# (comando en docs/equipo/09-despliegue.md). AIVEN_TRUSTSTORE_PATH es la ruta ABSOLUTA de ese .p12.
#   sslMode=VERIFY_CA        verifica que el certificado del servidor lo firma el CA de Aiven (por defecto).
#   AIVEN_SSL_MODE=VERIFY_IDENTITY  además verifica que el host coincida con el certificado.
# Nunca bajar a PREFERRED/REQUIRED: cifrarían sin verificar al servidor.
spring:
  datasource:
    url: "jdbc:mysql://${GATEWAY_DB_HOST}:${GATEWAY_DB_PORT}/${GATEWAY_DB_NAME:gateway}?sslMode=${AIVEN_SSL_MODE:VERIFY_IDENTITY}&trustCertificateKeyStoreUrl=file:${AIVEN_TRUSTSTORE_PATH}&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=${AIVEN_TRUSTSTORE_PASSWORD}&connectTimeout=${GATEWAY_DB_CONNECT_TIMEOUT_MS:3000}&socketTimeout=${GATEWAY_DB_SOCKET_TIMEOUT_MS:30000}&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true"
    hikari:
      # El gateway atiende tráfico público (API Keys, RNF5): se mantiene el criterio de fallar rápido con 503 y se
      # da 1 s más solo por el handshake TLS a internet.
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 5        # el plan de Aiven limita las conexiones; los servicios del mismo Aiven comparten el límite
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000        # recicla antes de que un firewall/proxy corte la conexión inactiva
      keepalive-time: 120000
