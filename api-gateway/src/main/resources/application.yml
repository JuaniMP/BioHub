spring:
  application:
    name: api-gateway
  config:
    # Lee el .env de la raíz del monorepo (al ejecutar desde la carpeta del servicio)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_GATEWAY_HOST:localhost}:${MYSQL_GATEWAY_PORT:3310}/gateway
    username: ${MYSQL_GATEWAY_USER}
    password: ${MYSQL_GATEWAY_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, nunca Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/biohub}
          audiences: ${KEYCLOAK_AUDIENCE:biohub-api}

server:
  port: ${API_GATEWAY_PORT:8080}
  # Solo localhost: obliga a entrar por el gateway. En contenedores usar SERVER_ADDRESS=0.0.0.0 + red interna.
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

biohub:
  gateway:
    # /api/<prefijo>/** -> servicio destino (se conserva la ruta completa)
    rutas:
      cientifico: ${SERVICIO_CIENTIFICO_URL:http://localhost:8081}
      equipos: ${SERVICIO_EQUIPOS_URL:http://localhost:8082}
      publica: ${SERVICIO_CONSULTA_PUBLICA_URL:http://localhost:8083}
      reportes: ${SERVICIO_REPORTES_URL:http://localhost:8084}
    # Prefijos sin JWT (solo GET). Se protegerán con API Key + rate limiting.
    rutas-publicas:
      - publica
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:5173,http://localhost:5174}
    timeout-conexion: 2s
    timeout-lectura: 30s
    tamano-maximo-cuerpo: 10MB
