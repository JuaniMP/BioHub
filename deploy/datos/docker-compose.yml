# BioHub - VM biohub-datos. 4 MySQL 8.4, puertos publicados SOLO en la IP de Tailscale.
# Uso (en la VM):  docker compose up -d --wait      (requiere .env: ver .env.example)

x-mysql: &mysql
  image: mysql:8.4
  restart: unless-stopped
  # skip-name-resolve: el host del usuario se compara por IP, sin DNS inverso
  command: ["--skip-name-resolve", "--character-set-server=utf8mb4"]
  healthcheck:
    test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s

services:
  mysql-transaccional:
    <<: *mysql
    container_name: biohub-mysql-transaccional
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TRANSACCIONAL_ROOT_PASSWORD:?Falta en .env}
      MYSQL_ROOT_HOST: 127.0.0.1   # root solo local (no existe root@'%')
      MYSQL_APP_HOST: ${TS_IP_BACKEND:?Falta TS_IP_BACKEND en .env}
      MYSQL_CIENTIFICO_USER: ${MYSQL_CIENTIFICO_USER:?Falta en .env}
      MYSQL_CIENTIFICO_PASSWORD: ${MYSQL_CIENTIFICO_PASSWORD:?Falta en .env}
      MYSQL_EQUIPOS_USER: ${MYSQL_EQUIPOS_USER:?Falta en .env}
      MYSQL_EQUIPOS_PASSWORD: ${MYSQL_EQUIPOS_PASSWORD:?Falta en .env}
      TZ: America/Bogota
    ports:
      - "${TS_IP_DATOS:?Falta TS_IP_DATOS en .env}:${MYSQL_TRANSACCIONAL_PORT:-3307}:3306"
    volumes:
      - mysql-transaccional-data:/var/lib/mysql
      - ./init/01-transaccional.sh:/docker-entrypoint-initdb.d/01-transaccional.sh:ro

  mysql-lectura:
    <<: *mysql
    container_name: biohub-mysql-lectura
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_LECTURA_ROOT_PASSWORD:?Falta en .env}
      MYSQL_ROOT_HOST: 127.0.0.1
      MYSQL_APP_HOST: ${TS_IP_BACKEND:?Falta TS_IP_BACKEND en .env}
      APP_DB: consulta_publica
      APP_USER: ${MYSQL_LECTURA_USER:?Falta en .env}
      APP_PASSWORD: ${MYSQL_LECTURA_PASSWORD:?Falta en .env}
      TZ: America/Bogota
    ports:
      - "${TS_IP_DATOS:?Falta TS_IP_DATOS en .env}:${MYSQL_LECTURA_PORT:-3308}:3306"
    volumes:
      - mysql-lectura-data:/var/lib/mysql
      - ./init/01-usuario-unico.sh:/docker-entrypoint-initdb.d/01-usuario-unico.sh:ro

  mysql-analitica:
    <<: *mysql
    container_name: biohub-mysql-analitica
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ANALITICA_ROOT_PASSWORD:?Falta en .env}
      MYSQL_ROOT_HOST: 127.0.0.1
      MYSQL_APP_HOST: ${TS_IP_BACKEND:?Falta TS_IP_BACKEND en .env}
      APP_DB: reportes
      APP_USER: ${MYSQL_ANALITICA_USER:?Falta en .env}
      APP_PASSWORD: ${MYSQL_ANALITICA_PASSWORD:?Falta en .env}
      TZ: America/Bogota
    ports:
      - "${TS_IP_DATOS:?Falta TS_IP_DATOS en .env}:${MYSQL_ANALITICA_PORT:-3309}:3306"
    volumes:
      - mysql-analitica-data:/var/lib/mysql
      - ./init/01-usuario-unico.sh:/docker-entrypoint-initdb.d/01-usuario-unico.sh:ro

  mysql-gateway:
    <<: *mysql
    container_name: biohub-mysql-gateway
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_GATEWAY_ROOT_PASSWORD:?Falta en .env}
      MYSQL_ROOT_HOST: 127.0.0.1
      MYSQL_APP_HOST: ${TS_IP_BACKEND:?Falta TS_IP_BACKEND en .env}
      APP_DB: gateway
      APP_USER: ${MYSQL_GATEWAY_USER:?Falta en .env}
      APP_PASSWORD: ${MYSQL_GATEWAY_PASSWORD:?Falta en .env}
      TZ: America/Bogota
    ports:
      - "${TS_IP_DATOS:?Falta TS_IP_DATOS en .env}:${MYSQL_GATEWAY_PORT:-3310}:3306"
    volumes:
      - mysql-gateway-data:/var/lib/mysql
      - ./init/01-usuario-unico.sh:/docker-entrypoint-initdb.d/01-usuario-unico.sh:ro

volumes:
  mysql-transaccional-data:
  mysql-lectura-data:
  mysql-analitica-data:
  mysql-gateway-data:
